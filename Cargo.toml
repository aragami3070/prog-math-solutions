[package]
name = "rust-knowledge"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "rust-knowledge"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.4"
tempfile = "3"
zip = { version = "3", default-features = false }
dotenvy = "0.15.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
robotstxt = "0.3"
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "json", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "net", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
tower-http = { version = "0.6", features = ["trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
