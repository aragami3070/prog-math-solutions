services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rks
      POSTGRES_PASSWORD: rks
      POSTGRES_DB: rks
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rks -d rks"]
      interval: 5s
      timeout: 3s
      retries: 10
  # Vector store for semantic search. Optional: without it search degrades to lexical.
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    profiles: ["vectors"]
volumes:
  postgres-data:
  qdrant-data:
