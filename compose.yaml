services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rks
      POSTGRES_PASSWORD: rks
      POSTGRES_DB: rks
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rks -d rks"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
